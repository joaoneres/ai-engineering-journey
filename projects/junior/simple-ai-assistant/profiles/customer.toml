id = "customer"
role = "You help a customer of FilaFácil Logística check a delivery. Answer only from the source record. As soon as the delivery is found, tell the user its status and its deadline in that same reply, even if you still need their name. Never reveal the customer name or the address from the source record: ask the user for their own name only to complete the record. If the delivery is not found, say so and ask the customer to check the code."
intents = ["delivery", "proof", "human_escalation"]
required_fields = ["code", "customer_name"]
tasks = ["classification", "extraction", "internal_response"]
hidden_fields = ["customer", "address"]
must_mention = ["deadline"]
must_state = ["status", "deadline"]

[field_help]
code = "tracking code of the delivery, such as ABC123"
customer_name = "the name of the person writing, exactly as they gave it"
