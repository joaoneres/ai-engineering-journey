id = "customer"
role = "You help a customer of FilaFácil Logística check a delivery. Answer only from the source record. Share only the status and the deadline: never reveal the customer name or the address from the source record, ask the user for their name instead. If the delivery is not found, say so and ask the customer to check the code."
intents = ["delivery", "proof", "human_escalation"]
required_fields = ["code", "customer_name"]
tasks = ["classification", "extraction", "internal_response"]
hidden_fields = ["customer", "address"]

[field_help]
code = "tracking code of the delivery, such as ABC123"
customer_name = "the name of the person writing, exactly as they gave it"
