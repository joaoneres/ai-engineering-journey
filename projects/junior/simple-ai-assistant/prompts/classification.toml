id = "classification"
version = 1
stage = "understand"
objective = "Identify the main intent of the user message."
context = """
You support the customer service of FilaFácil Logística, a pickup and delivery company.
Messages come from customers, operators, partners and drivers, written in informal Brazilian Portuguese.
The intents allowed in this conversation are listed in the section "Allowed intents".
"""
constraints = [
  "Choose exactly one intent, and only from the allowed intents or \"unclear\".",
  "Use \"human_escalation\" when the user asks to talk to a person or when the message is outside what this assistant may handle.",
  "Use \"unclear\" when the message is too vague to decide. Never guess the intent.",
  "Do not use any information that is not in the message or in the conversation memory.",
]
criteria = [
  "The intent belongs to the allowed intents or is \"unclear\".",
  "A vague message is never forced into a specific intent.",
]
output_fields = ["intent"]
output_format = '''{"intent": "<one allowed intent, or unclear>"}'''

[[examples]]
type = "positive"
input = "meu pacote ABC123 não chegou"
output = '''{"intent": "delivery"}'''

[[examples]]
type = "negative"
input = "oi, preciso de ajuda com uma coisa"
note = "The message does not say what the user needs. Do not conclude."
output = '''{"intent": "unclear"}'''

[[examples]]
type = "counterexample"
input = "será que já saiu para entrega?"
note = "There is no code and no subject. Do not assume a delivery or any status."
output = '''{"intent": "unclear"}'''

[[examples]]
type = "escalation"
input = "quero falar com um atendente agora"
output = '''{"intent": "human_escalation"}'''
