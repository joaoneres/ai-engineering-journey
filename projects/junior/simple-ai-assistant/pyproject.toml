[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ai-assistant"
version = "0.1.0"
description = "FilaFácil Logística: a terminal assistant built on a reusable prompt library with grounding and validated LLM output."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "João Vitor" }]
dependencies = []

[project.scripts]
ai-assistant = "ai_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: pyupgrade, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
